[workspace]
members = ["hardware", "data", "ui"]
default-members = [".", "hardware", "data", "ui"]
resolver = "3"

[workspace.package]
version = "0.1.6"
edition = "2024"
license = "MIT"

[package]
name = "windisplaymanager_rs"
description = "Windows Display Manager - DDC/CI monitor control with GUI"
version.workspace = true
edition.workspace = true
license.workspace = true

[profile.release]
strip = true
lto = "thin"

[build-dependencies]
winresource = "0.1"

[dependencies]
data.workspace = true
ui.workspace = true
env_logger.workspace = true
libcosmic.workspace = true

[workspace.dependencies]
hardware = { path = "hardware" }
data = { path = "data" }
ui = { path = "ui" }
ddc = "0.2"
ddc-winapi = "0.2"
global-hotkey = "0.8"
thiserror = "2.0"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6.0"
log = "0.4"
env_logger = "0.11"
tray-icon = "0.25"
winreg = "0.55"
anyhow = "1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Devices_Display",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[workspace.dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
default-features = false
features = [
    "about",
    "multi-window",
    "tokio",
    "winit",
    "wgpu",
]
